# Formatting, lint, types, tests, the build and the published package's
# shape, on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # What ships has no known vulnerability.
      - run: pnpm audit --prod
      # Built first: the lint reads the types of what scripts/smoke.mjs
      # imports, which is the built package.
      - run: pnpm build
      - run: pnpm check
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm check-package

  load:
    # The oldest Node the package supports and the current one load the
    # built package both ways its users do.
    name: Load on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["22.12", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - name: import
        run: node scripts/smoke.mjs
      - name: require
        run: node -e "const { generateKeys } = require('sealbound'); if (typeof generateKeys().publicKey !== 'string') process.exit(1);"

  runtimes:
    # The built package seals and opens on the runtimes that aren't Node,
    # which have none of Node's own modules.
    name: Run on Bun and Deno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: oven-sh/setup-bun@v2
      - run: bun run scripts/smoke.mjs
      - uses: denoland/setup-deno@v2
      - run: deno run scripts/smoke.mjs
